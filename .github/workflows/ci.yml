name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Integration test
        run: |
          mkdir -p coverdata
          go build -cover -o bin/litepub .
          pip install -r tests/requirements.txt
          export GOCOVERDIR=${{ github.workspace }}/coverdata
          cd tests && pytest -v
          cd ${{ github.workspace }}
          echo "coverdata contents:"
          ls -la coverdata/
          go tool covdata textfmt -i=coverdata -o=coverage-integration.out
          echo "integration coverage:"
          cat coverage-integration.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out,coverage-integration.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Lint
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1
          staticcheck ./...
